<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetCare AI</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <h1>PetCare AI</h1>
    <p>Asistente veterinario, establecimientos y registro de mascotas</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Registro / Mascotas (Supabase)</h2>
      <form id="mascota-form" class="form-grid">
        <input type="text" id="nombre-mascota" placeholder="Nombre de la mascota" required />
        <input type="text" id="especie-mascota" placeholder="Especie (Perro, Gato...)" required />
        <input type="text" id="raza-mascota" placeholder="Raza / Edad" />
        <button type="submit">Guardar mascota</button>
      </form>
      <ul id="lista-mascotas" class="lista"></ul>
    </section>

    <section class="card">
      <h2>Chat con Gemini AI</h2>
      <div id="chat-mensajes" class="chat-box"></div>
      <form id="chat-form" class="chat-form">
        <input type="text" id="chat-input" placeholder="Preguntá sobre cuidados de tu mascota..." required />
        <button type="submit">Enviar</button>
      </form>
    </section>

    <section class="card">
      <h2>Mapa y Establecimientos</h2>
      <div id="map" class="map-box"></div>
      <ul id="lista-establecimientos" class="lista"></ul>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
